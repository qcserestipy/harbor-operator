apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: harbor-operator-ns

resources:
- ../crd
- ../manager
- ../rbac
- ../webhook
- ../certmanager

patches:
- path: manager_prometheus_metrics_patch.yaml
- path: manager_webhook_patch.yaml
- path: webhookcainjection_patch.yaml
- path: webhook_namespaceselector_patch.yaml

# Modern replacements instead of deprecated vars
replacements:
  # CERTIFICATE_NAMESPACE replacement
  - source:
      kind: Certificate
      group: cert-manager.io
      version: v1
      name: serving-cert
      fieldPath: metadata.namespace
    targets:
      - select:
          kind: ValidatingWebhookConfiguration
        fieldPaths:
          - "webhooks.*.clientConfig.service.namespace"
      - select:
          kind: MutatingWebhookConfiguration 
        fieldPaths:
          - "webhooks.*.clientConfig.service.namespace"
      # Add this to replace CERTIFICATE_NAMESPACE_PLACEHOLDER in annotation
      - select:
          kind: ValidatingWebhookConfiguration
          name: validating-webhook-configuration
        fieldPaths:
          - "metadata.annotations.cert-manager\\.io/inject-ca-from"
        options:
          delimiter: "/"
          index: 0
      - select:
          kind: MutatingWebhookConfiguration
          name: mutating-webhook-configuration
        fieldPaths:
          - "metadata.annotations.cert-manager\\.io/inject-ca-from"
        options:
          delimiter: "/"
          index: 0

  # CERTIFICATE_NAME replacement
  - source:
      kind: Certificate
      group: cert-manager.io
      version: v1
      name: serving-cert
      fieldPath: metadata.name
    targets:
      - select:
          kind: ValidatingWebhookConfiguration
        fieldPaths:
          - "webhooks.*.clientConfig.caBundle"
        options:
          create: true
      - select:
          kind: MutatingWebhookConfiguration
        fieldPaths:
          - "webhooks.*.clientConfig.caBundle"
        options:
          create: true
      # Add this to replace CERTIFICATE_NAME_PLACEHOLDER in annotation
      - select:
          kind: ValidatingWebhookConfiguration
          name: validating-webhook-configuration
        fieldPaths:
          - "metadata.annotations.cert-manager\\.io/inject-ca-from"
        options:
          delimiter: "/"
          index: 1
      - select:
          kind: MutatingWebhookConfiguration
          name: mutating-webhook-configuration
        fieldPaths:
          - "metadata.annotations.cert-manager\\.io/inject-ca-from"
        options:
          delimiter: "/"
          index: 1

  # SERVICE_NAMESPACE replacement
  - source:
      kind: Service
      version: v1
      name: webhook-service  
      fieldPath: metadata.namespace
    targets:
      - select:
          kind: ValidatingWebhookConfiguration
        fieldPaths:
          - "webhooks.*.clientConfig.service.namespace"
      - select:
          kind: MutatingWebhookConfiguration
        fieldPaths:
          - "webhooks.*.clientConfig.service.namespace"

  # SERVICE_NAME replacement
  - source:
      kind: Service
      version: v1
      name: webhook-service
    targets:
      - select:
          kind: ValidatingWebhookConfiguration
        fieldPaths:
          - "webhooks.*.clientConfig.service.name"
      - select:
          kind: MutatingWebhookConfiguration
        fieldPaths:
          - "webhooks.*.clientConfig.service.name"