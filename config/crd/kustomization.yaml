# This kustomization.yaml is not intended to be run by itself,
# since it depends on service name and namespace that are out of this kustomize package.
# It should be run by config/default
resources:
- bases/goharbor.io_chartmuseums.yaml
- bases/goharbor.io_cores.yaml
- bases/goharbor.io_exporters.yaml
- bases/goharbor.io_harbors.yaml
- bases/goharbor.io_jobservices.yaml
- bases/goharbor.io_notaryservers.yaml
- bases/goharbor.io_notarysigners.yaml
- bases/goharbor.io_portals.yaml
- bases/goharbor.io_registries.yaml
- bases/goharbor.io_registrycontrollers.yaml
- bases/goharbor.io_trivies.yaml
- bases/goharbor.io_harborclusters.yaml
- bases/goharbor.io_harborconfigurations.yaml
- bases/goharbor.io_harborprojects.yaml
- bases/goharbor.io_harborserverconfigurations.yaml
- bases/goharbor.io_pullsecretbindings.yaml
# +kubebuilder:scaffold:crdkustomizeresource

  # [WEBHOOK] To enable webhook, uncomment all the sections with [WEBHOOK] prefix.
  # patches here are for enabling the conversion webhook for each CRD
  # +kubebuilder:scaffold:crdkustomizewebhookpatch

  # [CERTMANAGER] To enable webhook, uncomment all the sections with [CERTMANAGER] prefix.
  # patches here are for enabling the CA injection for each CRD
# +kubebuilder:scaffold:crdkustomizecainjectionpatch

# the following config is for teaching kustomize how to do kustomization for CRDs.
configurations:
- kustomizeconfig.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
patches:
- path: patches/webhook_in_chartmuseums.yaml
- path: patches/webhook_in_cores.yaml
- path: patches/webhook_in_exporters.yaml
- path: patches/webhook_in_harbors.yaml
- path: patches/webhook_in_jobservices.yaml
- path: patches/webhook_in_notaryservers.yaml
- path: patches/webhook_in_notarysigners.yaml
- path: patches/webhook_in_portals.yaml
- path: patches/webhook_in_registries.yaml
- path: patches/webhook_in_registrycontrollers.yaml
- path: patches/webhook_in_harborclusters.yaml
- path: patches/webhook_in_trivies.yaml
- path: patches/cainjection_in_chartmuseums.yaml
- path: patches/cainjection_in_cores.yaml
- path: patches/cainjection_in_exporters.yaml
- path: patches/cainjection_in_harbors.yaml
- path: patches/cainjection_in_jobservices.yaml
- path: patches/cainjection_in_notaryservers.yaml
- path: patches/cainjection_in_notarysigners.yaml
- path: patches/cainjection_in_portals.yaml
- path: patches/cainjection_in_registries.yaml
- path: patches/cainjection_in_registrycontrollers.yaml
- path: patches/cainjection_in_harborclusters.yaml
- path: patches/cainjection_in_trivies.yaml
