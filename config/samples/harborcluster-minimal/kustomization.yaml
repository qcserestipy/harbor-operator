apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- https.yaml
- service_token_issuer.yaml
- storage.yaml
- goharbor_v1alpha3_harbor.yaml
- ../../kustomizeconfig

secretGenerator:
- literals:
  - secret=Harbor12345
  name: admin-core-secret
  type: goharbor.io/single-secret


labels:
- includeSelectors: true
  pairs:
    sample: "true"
patches:
- path: images_patch.yaml
