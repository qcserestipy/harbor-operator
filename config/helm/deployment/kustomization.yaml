apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namePrefix: '{{ include "chart.fullname" . }}-'
namespace: '{{ .Release.Namespace | quote }}'

generatorOptions:
  disableNameSuffixHash: true

images:
- name: goharbor/harbor-operator:dev
  newName: '{{.Values.image.registry}}/{{.Values.image.repository}}'
  newTag: '{{.Values.image.tag|default .Chart.AppVersion}}'

patches:
- path: patch_deployment_config.yaml
  target:
    group: apps
    kind: Deployment
    name: harbor-operator
    version: v1
- path: patch_deployment_webhook.yaml
  target:
    group: apps
    kind: Deployment
    name: harbor-operator
    version: v1
- path: patch_deployment_metadata.yaml
  target:
    group: apps
    kind: Deployment
    name: harbor-operator
    version: v1
- path: patch_deployment_resources.yaml
  target:
    group: apps
    kind: Deployment
    name: harbor-operator
    version: v1
- path: patch_deployment_security.yaml
  target:
    group: apps
    kind: Deployment
    name: harbor-operator
    version: v1

resources:
- ../../default
